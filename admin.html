<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Great Adventure — Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Inter,sans-serif;}
  body{background:#101C26;color:#F6F2E9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .box{background:#16242F;border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:36px;width:100%;max-width:420px;}
  h1{font-size:20px;font-weight:600;margin-bottom:6px;}
  p.sub{font-size:13px;color:#C7D6DB;margin-bottom:26px;}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;color:#C7D6DB;margin-bottom:6px;margin-top:16px;}
  input,textarea{width:100%;padding:11px 13px;border-radius:4px;border:1px solid rgba(255,255,255,0.18);background:#101C26;color:#F6F2E9;font-size:14px;}
  textarea{min-height:80px;resize:vertical;}
  button{margin-top:22px;width:100%;padding:13px;border:none;border-radius:4px;background:#DD8B3E;color:#101C26;font-weight:600;font-size:14px;cursor:pointer;}
  button:hover{background:#e79c53;}
  button.secondary{background:transparent;border:1px solid rgba(255,255,255,0.25);color:#F6F2E9;margin-top:10px;}
  .toggle-row{display:flex;align-items:center;gap:10px;margin-top:18px;}
  .toggle-row input{width:auto;}
  .status{margin-top:16px;font-size:13px;padding:10px;border-radius:4px;display:none;}
  .status.ok{display:block;background:rgba(107,192,120,0.15);color:#9BE1AC;}
  .status.err{display:block;background:rgba(224,75,74,0.15);color:#F09595;}
  .setup-note{font-size:12px;color:#8FA0A8;margin-top:20px;line-height:1.5;}
  a{color:#DD8B3E;}
</style>
</head>
<body>

<div class="box" id="login-box">
  <h1>Admin login</h1>
  <p class="sub">Great Adventure — offer banner manager</p>
  <label>Email</label>
  <input type="email" id="login-email" placeholder="you@email.com">
  <label>Password</label>
  <input type="password" id="login-password" placeholder="Your password">
  <button onclick="doLogin()">Log in</button>
  <div class="status" id="login-status"></div>
  <p class="setup-note" id="setup-note"></p>
</div>

<div class="box" id="editor-box" style="display:none;max-width:520px;">
  <h1>Manage current offer</h1>
  <p class="sub">Changes go live on the website immediately.</p>

  <div class="toggle-row">
    <input type="checkbox" id="active-toggle">
    <label style="margin:0;">Show this offer on the website</label>
  </div>

  <label>Offer title</label>
  <input type="text" id="offer-title" placeholder="e.g. New Year Special — 20% off K2 Base Camp trek">

  <label>Offer details (optional)</label>
  <textarea id="offer-message" placeholder="e.g. Valid for bookings made before Jan 31"></textarea>

  <button onclick="saveOffer()">Save and publish</button>
  <button class="secondary" onclick="doLogout()">Log out</button>
  <div class="status" id="save-status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
  const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";
  let sb;

  function showStatus(id, msg, ok){
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = "status " + (ok ? "ok" : "err");
  }

  window.onload = function(){
    if(SUPABASE_URL.indexOf("PASTE_") === 0){
      document.getElementById("setup-note").innerHTML =
        "Setup needed: paste your Supabase URL and anon key into this file, then refresh. See the setup guide provided with this file.";
      return;
    }
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.auth.getSession().then(({data}) => {
      if(data.session) showEditor();
    });
  };

  async function doLogin(){
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ showStatus("login-status", error.message, false); return; }
    showEditor();
  }

  async function doLogout(){
    await sb.auth.signOut();
    document.getElementById("editor-box").style.display = "none";
    document.getElementById("login-box").style.display = "block";
  }

  async function showEditor(){
    document.getElementById("login-box").style.display = "none";
    document.getElementById("editor-box").style.display = "block";
    const { data } = await sb.from("announcements").select("*").eq("id", 1).single();
    if(data){
      document.getElementById("active-toggle").checked = !!data.active;
      document.getElementById("offer-title").value = data.title || "";
      document.getElementById("offer-message").value = data.message || "";
    }
  }

  async function saveOffer(){
    const payload = {
      id: 1,
      active: document.getElementById("active-toggle").checked,
      title: document.getElementById("offer-title").value.trim(),
      message: document.getElementById("offer-message").value.trim(),
      updated_at: new Date().toISOString()
    };
    const { error } = await sb.from("announcements").upsert(payload);
    if(error){ showStatus("save-status", error.message, false); return; }
    showStatus("save-status", "Saved. Live on the website now.", true);
  }
</script>
</body>
</html>
